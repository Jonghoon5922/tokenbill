<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokenbill — AI API 비용 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --accent-ink: #1c5cab;
    --s-openai: #1baf7a; --s-anthropic: #eb6834; --s-google: #2a78d6;
    --warn: #fab219; --warn-ink: #8a5f00; --critical: #d03b3b; --critical-ink: #a02020;
    --good-ink: #006300; --chip: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --accent: #3987e5; --accent-ink: #86b6ef;
      --s-openai: #199e70; --s-anthropic: #d95926; --s-google: #3987e5;
      --warn: #fab219; --warn-ink: #fab219; --critical: #e66767; --critical-ink: #e66767;
      --good-ink: #0ca30c; --chip: #262624;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 72px; }
  header.top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--grid); margin-bottom: 24px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }
  .brand h1 .won { color: var(--accent); }
  .brand .tag { font-size: 0.85rem; color: var(--ink-2); }
  .hdr-ctls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--ink-2); }
  .hdr-ctls input {
    width: 84px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums;
  }
  .cur-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .cur-toggle button { padding: 5px 12px; border: none; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 0.78rem; cursor: pointer; }
  .cur-toggle button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .band { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.2fr; gap: 12px; margin-bottom: 24px; }
  @media (max-width: 800px) { .band { grid-template-columns: 1fr 1fr; } }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
  .tile .lbl { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tile .val { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .tile.hero .val { font-size: 2.2rem; color: var(--accent-ink); }
  .tile .sub { font-size: 0.78rem; color: var(--ink-2); }
  .tile .sub.up { color: var(--critical-ink); font-weight: 600; }
  .tile .sub.down { color: var(--good-ink); font-weight: 600; }
  .meter { height: 6px; background: var(--chip); border-radius: 999px; margin-top: 8px; overflow: hidden; }
  .meter > div { height: 100%; border-radius: 999px; background: var(--accent); }
  .meter.over > div { background: var(--critical); }
  .meter.near > div { background: var(--warn); }
  .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 880px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .card h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card h2 .cnt { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  .prov { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--grid); }
  .prov:last-child { border-bottom: none; }
  .prov .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .prov .nm { font-weight: 600; font-size: 0.92rem; flex: 1; min-width: 0; }
  .prov .nm .key { display: block; font-size: 0.72rem; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .prov .nm .err { display: block; font-size: 0.72rem; font-weight: 500; color: var(--critical-ink); }
  .prov .amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prov .amt .cap { display: block; font-size: 0.7rem; font-weight: 400; color: var(--muted); text-align: right; }
  .btn { padding: 7px 14px; border-radius: 7px; border: none; cursor: pointer; background: var(--accent); color: #fff; font: inherit; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
  .btn:hover { filter: brightness(0.92); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--border); }
  .btn.ghost:hover { background: var(--chip); filter: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .keyform { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .keyform input { flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--page); color: var(--ink); font: inherit; font-size: 0.82rem; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .keyform input.orglabel { flex: 0 1 110px; min-width: 90px; font-family: inherit; }
  .prov.org { padding-left: 26px; }
  .prov.org .nm { font-weight: 500; }
  .prov .addorg { font-size: 0.74rem; padding: 4px 10px; }
  .legend { display: flex; gap: 14px; font-size: 0.76rem; color: var(--ink-2); margin-bottom: 8px; flex-wrap: wrap; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }
  .chart-note { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
  svg text { font-family: inherit; }
  .tooltip { position: fixed; pointer-events: none; z-index: 10; display: none; background: var(--ink); color: var(--page); border-radius: 7px; padding: 8px 10px; font-size: 0.75rem; line-height: 1.55; box-shadow: 0 4px 14px rgba(0,0,0,0.25); font-variant-numeric: tabular-nums; max-width: 220px; }
  .hbar-row { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 0.8rem; }
  .hbar-row .nm { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 0.74rem; }
  .hbar-track { height: 14px; position: relative; }
  .hbar-fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar-row .v { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .insight { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 0.85rem; margin-bottom: 10px; }
  .insight strong { color: var(--warn-ink); }
  .insight.bad { border-left-color: var(--critical); background: color-mix(in srgb, var(--critical) 7%, var(--surface)); }
  .insight.bad strong { color: var(--critical-ink); }
  .insight.ok { border-left-color: var(--good-ink); background: color-mix(in srgb, var(--good-ink) 7%, var(--surface)); }
  .insight.ok strong { color: var(--good-ink); }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 18px 4px; text-align: center; }
  footer.ft { margin-top: 36px; font-size: 0.75rem; color: var(--muted); text-align: center; }

  /* ── auth ── */
  #authView { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 100%; max-width: 380px; }
  .auth-card h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; text-align: center; }
  .auth-card h1 .won { color: var(--accent); }
  .auth-card .tag { text-align: center; color: var(--ink-2); font-size: 0.85rem; margin: 4px 0 22px; }
  .auth-tabs { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
  .auth-tabs button { flex: 1; padding: 8px; border: none; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 0.85rem; cursor: pointer; }
  .auth-tabs button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .auth-card form { display: flex; flex-direction: column; gap: 10px; }
  .auth-card input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--page); color: var(--ink); font: inherit; font-size: 0.9rem; }
  .auth-card .btn { padding: 10px; font-size: 0.9rem; margin-top: 4px; }
  .auth-err { color: var(--critical-ink); font-size: 0.8rem; min-height: 1.2em; }
  .hidden { display: none !important; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; z-index: 20; display: none; }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="authView">
  <div class="auth-card">
    <h1>Token<span class="won">bill</span></h1>
    <p class="tag">AI API 비용, 한 화면에서</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="on">로그인</button>
      <button id="tabSignup">회원가입</button>
    </div>
    <form id="authForm">
      <input type="email" id="authEmail" placeholder="이메일" required autocomplete="email">
      <input type="password" id="authPw" placeholder="비밀번호 (8자 이상)" required minlength="8" autocomplete="current-password">
      <p class="auth-err" id="authErr"></p>
      <button type="submit" class="btn" id="authBtn">로그인</button>
    </form>
  </div>
</div>

<!-- 대시보드 -->
<div id="dashView" class="hidden">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Token<span class="won">bill</span></h1>
      <span class="tag">AI API 비용, 한 화면에서</span>
    </div>
    <div class="hdr-ctls">
      <span class="cur-toggle" role="group" aria-label="표시 통화">
        <button id="curUSD">USD</button><button id="curKRW">KRW</button>
      </span>
      <label for="fxRate">환율</label>
      <input type="number" id="fxRate" min="1" step="10" aria-label="USD 대 KRW 환율">
      <label for="budget">월 예산 $</label>
      <input type="number" id="budget" min="0" step="10">
      <button class="btn ghost" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="band">
    <div class="tile hero">
      <span class="lbl">이번 달 총 비용</span>
      <span class="val" id="tTotal">—</span>
      <span class="sub" id="tTotalSub">&nbsp;</span>
    </div>
    <div class="tile">
      <span class="lbl">어제</span>
      <span class="val" id="tYesterday">—</span>
      <span class="sub" id="tYesterdaySub">&nbsp;</span>
    </div>
    <div class="tile">
      <span class="lbl">월말 예상</span>
      <span class="val" id="tProjected">—</span>
      <span class="sub">최근 7일 평균 기준</span>
    </div>
    <div class="tile">
      <span class="lbl">예산 대비</span>
      <span class="val" id="tBudget">—</span>
      <div class="meter" id="budgetMeter"><div style="width:0%"></div></div>
      <span class="sub" id="tBudgetSub">&nbsp;</span>
    </div>
  </div>

  <div class="cols">
    <div>
      <section class="card">
        <h2>일별 비용 <span class="cnt">최근 30일 · 프로바이더별</span></h2>
        <div class="legend" id="dailyLegend"></div>
        <div id="dailyChart"></div>
        <p class="chart-note">막대에 마우스를 올리면 상세 내역이 표시됩니다.</p>
      </section>
      <section class="card">
        <h2>모델별 사용량 <span class="cnt">이번 달</span>
          <span class="cur-toggle" role="group" aria-label="모델별 보기 기준" style="margin-left:auto">
            <button id="mvCost" class="on">비용</button><button id="mvTok">토큰</button>
          </span>
        </h2>
        <div id="modelChart"></div>
      </section>
    </div>
    <div>
      <section class="card">
        <h2>연결된 프로바이더 <span class="cnt" id="provCnt"></span>
          <button class="btn ghost" id="syncBtn" style="margin-left:auto">지금 갱신</button>
        </h2>
        <p class="chart-note" id="syncInfo" style="margin:-6px 0 10px"></p>
        <div id="provList"></div>
      </section>
      <section class="card">
        <h2>인사이트</h2>
        <div id="insightBox"></div>
      </section>
    </div>
  </div>

  <footer class="ft">Tokenbill — OpenAI·Anthropic은 조직 Admin 키가 필요해요. "demo"로 시작하는 키를 넣으면 체험용 데이터가 생성됩니다.</footer>
</div>
</div>
<div class="tooltip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var PROVIDERS = {
    openai:    { name: "OpenAI",    color: "var(--s-openai)",    keyPrefix: "sk-admin-" },
    anthropic: { name: "Anthropic", color: "var(--s-anthropic)", keyPrefix: "sk-ant-admin-" },
    google:    { name: "Google AI", color: "var(--s-google)",    keyPrefix: "AIza" }
  };
  var $ = function (id) { return document.getElementById(id); };
  var token = null;
  try { token = localStorage.getItem("tokenbill-token"); } catch (e) {}

  // 서버 데이터 캐시
  var me = null, providers = [], daily = [], modelRows = [];
  var modelView = "cost";

  // ── API helper ──
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, token ? { "Authorization": "Bearer " + token } : {});
    if (opts.body) opts.headers["Content-Type"] = "application/json";
    return fetch(path, opts).then(function (r) {
      if (r.status === 401 && path.indexOf("/api/auth/") !== 0) { logout(); throw new Error("로그인이 필요합니다"); }
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.detail || "요청 실패");
        return j;
      });
    });
  }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.style.display = "block";
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, 3500);
  }

  // ── auth ──
  var authMode = "login";
  function setAuthMode(m) {
    authMode = m;
    $("tabLogin").className = m === "login" ? "on" : "";
    $("tabSignup").className = m === "signup" ? "on" : "";
    $("authBtn").textContent = m === "login" ? "로그인" : "가입하기";
    $("authErr").textContent = "";
  }
  $("tabLogin").addEventListener("click", function () { setAuthMode("login"); });
  $("tabSignup").addEventListener("click", function () { setAuthMode("signup"); });
  $("authForm").addEventListener("submit", function (e) {
    e.preventDefault();
    $("authErr").textContent = "";
    api("/api/auth/" + (authMode === "login" ? "login" : "register"), {
      method: "POST",
      body: JSON.stringify({ email: $("authEmail").value, password: $("authPw").value })
    }).then(function (r) {
      token = r.token;
      try { localStorage.setItem("tokenbill-token", token); } catch (e) {}
      showDash();
    }).catch(function (e) { $("authErr").textContent = e.message; });
  });
  function logout() {
    token = null;
    try { localStorage.removeItem("tokenbill-token"); } catch (e) {}
    $("dashView").classList.add("hidden");
    $("authView").classList.remove("hidden");
  }
  $("logoutBtn").addEventListener("click", logout);

  // ── dashboard data ──
  function refreshAll() {
    return Promise.all([
      api("/api/me"), api("/api/providers"), api("/api/usage/daily?days=45"), api("/api/usage/models")
    ]).then(function (rs) {
      me = rs[0]; providers = rs[1]; daily = rs[2]; modelRows = rs[3];
      render();
    }).catch(function (e) { toast(e.message); });
  }
  function showDash() {
    $("authView").classList.add("hidden");
    $("dashView").classList.remove("hidden");
    refreshAll();
  }

  // ── settings controls ──
  function patchMe(body) {
    api("/api/me", { method: "PATCH", body: JSON.stringify(body) })
      .then(function () { return refreshAll(); })
      .catch(function (e) { toast(e.message); });
  }
  $("fxRate").addEventListener("change", function () {
    var v = Number(this.value); if (v > 0) patchMe({ fx_rate: v });
  });
  $("budget").addEventListener("change", function () {
    var v = Number(this.value); if (v >= 0) patchMe({ budget_usd: v });
  });
  $("curUSD").addEventListener("click", function () { patchMe({ currency: "USD" }); });
  $("curKRW").addEventListener("click", function () { patchMe({ currency: "KRW" }); });
  $("mvCost").addEventListener("click", function () { modelView = "cost"; render(); });
  $("mvTok").addEventListener("click", function () { modelView = "tok"; render(); });

  function syncErrors(sync) {
    return (sync || []).filter(function (s) { return !s.ok; }).map(function (s) {
      return PROVIDERS[s.provider].name + " (" + s.label + "): " + s.error;
    });
  }

  $("syncBtn").addEventListener("click", function () {
    var btn = this; btn.disabled = true; btn.textContent = "갱신 중…";
    api("/api/sync", { method: "POST" })
      .then(function (r) {
        var errs = syncErrors(r.sync);
        toast(errs.length ? errs.join(" / ") : "갱신 완료");
        return refreshAll();
      })
      .catch(function (e) { toast(e.message); return refreshAll(); });
  });

  window.tokenbill = {
    showKeyForm: function (pid) {
      var f = $("form-" + pid);
      if (f) f.classList.toggle("hidden");
    },
    connect: function (pid) {
      var input = $("key-" + pid);
      var val = input ? input.value.trim() : "";
      if (!val) { toast("API 키를 입력해 주세요"); return; }
      var labelInput = $("label-" + pid);
      var label = labelInput ? labelInput.value.trim() : "";
      var btn = $("cbtn-" + pid); if (btn) { btn.disabled = true; btn.textContent = "연결 중…"; }
      api("/api/providers", { method: "POST", body: JSON.stringify({ provider: pid, api_key: val, label: label || "기본" }) })
        .then(function (r) {
          var s = (r.sync || []).filter(function (x) { return x.key_id === r.key_id; })[0];
          if (s && !s.ok) toast(PROVIDERS[pid].name + ": " + s.error);
          else toast(PROVIDERS[pid].name + " 연결 완료");
          return refreshAll();
        })
        .catch(function (e) { toast(e.message); return refreshAll(); });
    },
    disconnect: function (keyId) {
      api("/api/providers/" + keyId, { method: "DELETE" })
        .then(refreshAll).catch(function (e) { toast(e.message); });
    }
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ── formatting ──
  function fmt(usd) {
    if (me && me.currency === "KRW") return "₩" + Math.round(usd * me.fx_rate).toLocaleString("ko-KR");
    return "$" + (usd >= 100 ? Math.round(usd).toLocaleString() : usd.toFixed(2));
  }
  function fmtTok(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return Math.round(n / 1e3) + "K";
    return String(Math.round(n));
  }
  function iso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function monthPrefix() { return iso(new Date()).slice(0, 7); }

  // ── aggregation from server rows ──
  function dayMap() {
    var map = {};
    daily.forEach(function (r) {
      (map[r.day] = map[r.day] || {})[r.provider] = { cost: r.cost_usd, tok: r.tokens };
    });
    return map;
  }
  function sumRange(map, fromOffset, toOffset) {
    var t = 0, today = new Date();
    for (var i = fromOffset; i >= toOffset; i--) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var rec = map[iso(d)];
      if (rec) for (var pid in rec) t += rec[pid].cost;
    }
    return t;
  }

  // ── render ──
  function render() {
    if (!me) return;
    $("curUSD").className = me.currency === "USD" ? "on" : "";
    $("curKRW").className = me.currency === "KRW" ? "on" : "";
    if (document.activeElement !== $("fxRate")) $("fxRate").value = me.fx_rate;
    if (document.activeElement !== $("budget")) $("budget").value = me.budget_usd;

    var connected = providers.filter(function (p) { return p.connected; }).map(function (p) { return p.provider; });
    var map = dayMap();
    var mp = monthPrefix();

    var monthTotal = 0, monthTok = 0;
    Object.keys(map).forEach(function (date) {
      if (date.indexOf(mp) === 0) for (var pid in map[date]) {
        monthTotal += map[date][pid].cost; monthTok += map[date][pid].tok;
      }
    });
    var yesterday = sumRange(map, 1, 1);
    var prior7 = sumRange(map, 8, 2) / 7;
    var last7avg = sumRange(map, 7, 1) / 7;
    var today = new Date();
    var daysLeft = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate() - today.getDate();
    var projected = monthTotal + last7avg * daysLeft;

    $("tTotal").textContent = connected.length ? fmt(monthTotal) : "—";
    $("tTotalSub").textContent = connected.length
      ? "토큰 " + fmtTok(monthTok) + " · " + connected.map(function (p) { return PROVIDERS[p].name; }).join(" · ")
      : "프로바이더를 연결해 보세요";
    $("tYesterday").textContent = connected.length ? fmt(yesterday) : "—";
    var diff = prior7 > 0 ? (yesterday - prior7) / prior7 : 0;
    var ySub = $("tYesterdaySub");
    if (!connected.length) { ySub.textContent = " "; ySub.className = "sub"; }
    else if (Math.abs(diff) < 0.15) { ySub.textContent = "7일 평균과 비슷"; ySub.className = "sub"; }
    else if (diff > 0) { ySub.textContent = "▲ 평균 대비 +" + Math.round(diff * 100) + "%"; ySub.className = "sub up"; }
    else { ySub.textContent = "▼ 평균 대비 " + Math.round(diff * 100) + "%"; ySub.className = "sub down"; }
    $("tProjected").textContent = connected.length ? fmt(projected) : "—";

    var pct = me.budget_usd > 0 ? (monthTotal / me.budget_usd) * 100 : 0;
    $("tBudget").textContent = connected.length && me.budget_usd > 0 ? Math.round(pct) + "%" : "—";
    var meter = $("budgetMeter");
    meter.className = "meter" + (pct >= 100 ? " over" : pct >= 80 ? " near" : "");
    meter.firstElementChild.style.width = Math.min(100, pct) + "%";
    $("tBudgetSub").textContent = connected.length && me.budget_usd > 0
      ? fmt(monthTotal) + " / " + fmt(me.budget_usd) : " ";

    renderSync(connected);
    renderProviders();
    renderDaily(map, connected);
    renderModels();
    renderInsights(connected, yesterday, prior7, projected, monthTotal, map);
  }

  function renderSync(connected) {
    var btn = $("syncBtn"), info = $("syncInfo");
    var rem = me.cooldown_sec || 0;
    btn.disabled = !connected.length || rem > 0;
    btn.textContent = rem > 0 ? Math.ceil(rem / 60) + "분 후 갱신 가능" : "지금 갱신";
    var lastTxt = "아직 없음";
    if (me.last_sync_at) {
      var mins = Math.round((Date.now() - new Date(me.last_sync_at).getTime()) / 60000);
      lastTxt = mins < 1 ? "방금 전" : mins < 60 ? mins + "분 전" : Math.round(mins / 60) + "시간 전";
    }
    info.textContent = "마지막 갱신: " + lastTxt + " · 매일 03시 자동 + 수동 갱신(" + me.cooldown_min + "분 간격)";
  }

  function renderProviders() {
    var el = $("provList");
    var connectedCnt = providers.filter(function (p) { return p.connected; }).length;
    var orgCnt = providers.reduce(function (n, p) { return n + (p.keys || []).length; }, 0);
    $("provCnt").textContent = connectedCnt + " / " + providers.length + (orgCnt > connectedCnt ? " · 조직 " + orgCnt : "");
    el.innerHTML = providers.map(function (p) {
      var meta = PROVIDERS[p.provider];
      var keyform = '<div class="keyform hidden" id="form-' + p.provider + '">' +
        '<input type="text" class="orglabel" id="label-' + p.provider + '" placeholder="조직 이름" aria-label="' + meta.name + ' 조직 이름">' +
        '<input type="password" id="key-' + p.provider + '" placeholder="' + meta.keyPrefix + '… 또는 demo" aria-label="' + meta.name + ' API 키">' +
        '<button class="btn" id="cbtn-' + p.provider + '" onclick="tokenbill.connect(\'' + p.provider + '\')">연결</button></div>';
      if (p.connected) {
        var head = '<div class="prov"><span class="dot" style="background:' + meta.color + '"></span>' +
          '<div class="nm">' + meta.name + '</div>' +
          '<div class="amt">' + fmt(p.month_cost_usd) + '<span class="cap">이번 달</span></div>' +
          '<button class="btn ghost addorg" onclick="tokenbill.showKeyForm(\'' + p.provider + '\')" aria-label="' + meta.name + ' 조직 추가" title="조직 추가">+</button></div>';
        var orgs = p.keys.map(function (k) {
          var err = k.status && k.status.indexOf("error:") === 0 ? k.status.slice(6).trim() : null;
          return '<div class="prov org">' +
            '<div class="nm" title="' + esc(k.key_masked || "") + '">' + esc(k.label) +
            (err ? '<span class="err">' + esc(err) + '</span>' : '') + '</div>' +
            '<div class="amt">' + fmt(k.month_cost_usd) + '</div>' +
            '<button class="btn ghost" onclick="tokenbill.disconnect(' + k.id + ')">해제</button></div>';
        }).join("");
        return head + orgs + keyform;
      }
      return '<div class="prov"><span class="dot" style="background:' + meta.color + ';opacity:0.35"></span>' +
        '<div class="nm" style="color:var(--muted)">' + meta.name + '</div>' +
        '<button class="btn" onclick="tokenbill.showKeyForm(\'' + p.provider + '\')">키 등록</button></div>' + keyform;
    }).join("");
  }

  function renderDaily(map, connected) {
    var el = $("dailyChart"), lg = $("dailyLegend");
    if (!connected.length) {
      el.innerHTML = '<p class="empty">프로바이더를 연결하면 일별 비용이 표시됩니다.</p>';
      lg.innerHTML = "";
      return;
    }
    lg.innerHTML = connected.map(function (pid) {
      return '<span class="key"><span class="sw" style="background:' + PROVIDERS[pid].color + '"></span>' + PROVIDERS[pid].name + '</span>';
    }).join("");

    var days = [], today = new Date();
    for (var i = 29; i >= 0; i--) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      days.push(iso(d));
    }
    var max = 1;
    days.forEach(function (dt) {
      var rec = map[dt], t = 0;
      if (rec) for (var pid in rec) t += rec[pid].cost;
      if (t > max) max = t;
    });

    var W = 560, H = 200, padT = 12, padB = 24, padL = 4, padR = 4;
    var plotH = H - padT - padB, cw = (W - padL - padR) / 30, bw = cw * 0.68;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" role="img" aria-label="최근 30일 일별 API 비용">';
    for (var g = 1; g <= 3; g++) {
      var gy = padT + plotH * (1 - g / 3);
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="var(--grid)"/>';
    }
    days.forEach(function (dt, idx) {
      var rec = map[dt] || {};
      var x = padL + cw * idx + (cw - bw) / 2;
      var yBase = H - padB, acc = 0;
      connected.forEach(function (pid, si) {
        var v = rec[pid] ? rec[pid].cost : 0;
        if (v <= 0) return;
        var h = (v / max) * plotH;
        var gapOffset = si > 0 ? 2 : 0;
        svg += '<rect x="' + x + '" y="' + (yBase - acc - h - gapOffset) + '" width="' + bw +
          '" height="' + Math.max(0.5, h - gapOffset) + '" fill="' + PROVIDERS[pid].color + '"' +
          (si === connected.length - 1 ? ' rx="2"' : '') + '/>';
        acc += h;
      });
      svg += '<rect class="hover-col" data-date="' + dt + '" x="' + (padL + cw * idx) + '" y="' + padT +
        '" width="' + cw + '" height="' + plotH + '" fill="transparent"/>';
      var dd = Number(dt.slice(8));
      if (dd === 1 || idx % 7 === 0)
        svg += '<text x="' + (x + bw / 2) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="9.5" fill="var(--muted)">' +
          Number(dt.slice(5, 7)) + "/" + dd + '</text>';
    });
    svg += '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="var(--baseline)"/>';
    svg += '</svg>';
    el.innerHTML = svg;

    var tip = $("tip");
    el.querySelectorAll(".hover-col").forEach(function (r) {
      r.addEventListener("mousemove", function (ev) {
        var dt = this.getAttribute("data-date");
        var rec = map[dt] || {};
        var lines = ['<strong>' + dt + '</strong>'], total = 0, tok = 0;
        connected.forEach(function (pid) {
          var v = rec[pid] ? rec[pid].cost : 0; total += v;
          tok += rec[pid] ? rec[pid].tok : 0;
          if (v > 0) lines.push(PROVIDERS[pid].name + " " + fmt(v));
        });
        lines.push("합계 " + fmt(total) + " · " + fmtTok(tok) + " tok");
        tip.innerHTML = lines.join("<br>");
        tip.style.display = "block";
        tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 180) + "px";
        tip.style.top = (ev.clientY + 14) + "px";
      });
      r.addEventListener("mouseleave", function () { tip.style.display = "none"; });
    });
  }

  function renderModels() {
    var el = $("modelChart");
    $("mvCost").className = modelView === "cost" ? "on" : "";
    $("mvTok").className = modelView === "tok" ? "on" : "";
    if (!modelRows.length) {
      el.innerHTML = '<p class="empty">연결 후 모델별 사용량이 집계됩니다.</p>';
      return;
    }
    var items = modelRows.map(function (r) {
      return { model: r.model, cost: r.cost_usd, inTok: r.input_tokens, outTok: r.output_tokens,
               color: (PROVIDERS[r.provider] || {}).color || "var(--accent)" };
    });
    var key = modelView === "tok" ? function (it) { return it.inTok + it.outTok; } : function (it) { return it.cost; };
    items.sort(function (a, b) { return key(b) - key(a); });
    var max = key(items[0]) || 1;
    el.innerHTML = items.slice(0, 9).map(function (it) {
      var w = Math.max(2, (key(it) / max) * 100);
      var label = modelView === "tok"
        ? fmtTok(it.inTok + it.outTok) + ' <span style="color:var(--muted)">(입력 ' + fmtTok(it.inTok) + ' · 출력 ' + fmtTok(it.outTok) + ')</span>'
        : fmt(it.cost);
      return '<div class="hbar-row"><span class="nm">' + esc(it.model) + '</span>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:' + w + '%;background:' + it.color + '"></div></div>' +
        '<span class="v">' + label + '</span></div>';
    }).join("");
  }

  function renderInsights(connected, yesterday, prior7, projected, monthTotal, map) {
    var el = $("insightBox");
    if (!connected.length) {
      el.innerHTML = '<p class="empty">프로바이더를 연결하면 비용 급증·예산 인사이트를 알려드려요.</p>';
      return;
    }
    var out = [];
    if (prior7 > 0 && yesterday > prior7 * 1.8) {
      var y = new Date(); y.setDate(y.getDate() - 1);
      var rec = map[iso(y)] || {}, top = null;
      for (var pid in rec) if (!top || rec[pid].cost > rec[top].cost) top = pid;
      out.push('<div class="insight bad">어제 비용이 7일 평균의 <strong>' +
        (yesterday / prior7).toFixed(1) + '배</strong>였어요' +
        (top ? ' (주 원인: <strong>' + PROVIDERS[top].name + '</strong>)' : '') +
        '. 반복 호출이나 배치 작업이 있었는지 확인해 보세요.</div>');
    }
    if (me.budget_usd > 0 && projected > me.budget_usd) {
      out.push('<div class="insight">이 추세면 월말 예상 비용이 <strong>' + fmt(projected) +
        '</strong>로 예산(' + fmt(me.budget_usd) + ')을 넘어요.</div>');
    }
    if (!out.length) {
      out.push('<div class="insight ok">비용이 안정적이에요. 이번 달 <strong>' + fmt(monthTotal) +
        '</strong> 사용 중, 예산 범위 안입니다.</div>');
    }
    el.innerHTML = out.join("");
  }

  // 쿨다운 표시 갱신
  setInterval(function () {
    if (me && me.cooldown_sec > 0) { me.cooldown_sec = Math.max(0, me.cooldown_sec - 30); render(); }
  }, 30000);

  if (token) showDash();
})();
</script>
</body>
</html>
